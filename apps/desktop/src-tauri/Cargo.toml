[package]
name = "aegis-ev-desktop"
version = "0.1.0"
description = "Aegis EV desktop UI shell"
authors = ["Aegis EV"]
license = "UNLICENSED"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
